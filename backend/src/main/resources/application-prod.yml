# Activate explicitly with SPRING_PROFILES_ACTIVE=prod (the Docker image defaults to it).
# No local database/key/origin fallback in this profile.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 25s
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  # Enable NATIVE only after configuring the actual trusted proxy IPs at deployment.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NONE}
  tomcat:
    redirect-context-root: false
    remoteip:
      internal-proxies: ${TRUSTED_PROXY_IPS:127\.0\.0\.1|::1}
app:
  auth:
    jwt:
      issuer: ${JWT_ISSUER}
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    session:
      cookie-secure: true
    password-reset:
      url: ${PASSWORD_RESET_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
