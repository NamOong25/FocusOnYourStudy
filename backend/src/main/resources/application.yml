spring:
  application:
    name: focus-study-backend
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/focus_study}
    username: ${DB_USER:focus_study}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 5
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 3
  jdbc:
    template:
      query-timeout: 3s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  mail:
    host: ${RESET_SMTP_HOST:}
    port: ${RESET_SMTP_PORT:587}
    username: ${RESET_SMTP_USERNAME:}
    password: ${RESET_SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${RESET_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${RESET_SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${RESET_SMTP_STARTTLS:true}
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  health:
    mail:
      # A disabled or temporarily unavailable reset mail service must not make the core API unhealthy.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  auth:
    jwt:
      issuer: ${JWT_ISSUER:urn:focus-study:local}
      audience: focus-study-api
      access-token-ttl: 15m
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:.local/auth/private.pem}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:.local/auth/public.pem}
    session:
      absolute-ttl: 30d
      refresh-ttl: 7d
      cookie-secure: ${AUTH_COOKIE_SECURE:false}
    password-reset:
      enabled: ${PASSWORD_RESET_ENABLED:false}
      url: ${PASSWORD_RESET_URL:http://localhost:8092/}
      from: ${PASSWORD_RESET_FROM:}
    rate-limit:
      login-per-minute: 30
      register-per-minute: 10
      refresh-per-minute: 60
      logout-per-minute: 60
      password-reset-request-per-minute: 5
      password-reset-confirm-per-minute: 10
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8092,http://127.0.0.1:8092,http://localhost:8081,http://127.0.0.1:8081}
logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
