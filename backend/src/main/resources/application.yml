spring:
  application:
    name: focus-study-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/focus_study}
    username: ${DB_USER:focus_study}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 5
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 3
  jdbc:
    template:
      query-timeout: 3s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8092,http://127.0.0.1:8092,http://localhost:8081,http://127.0.0.1:8081}
logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
